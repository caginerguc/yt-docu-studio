name: Vor der Realität – Belgesel Stüdyosu

on:
  schedule:
    # Haftada 2 video: Çarşamba ve Pazar 08:17 UTC (Berlin 09:17 kış / 10:17 yaz)
    - cron: '17 8 * * 3,0'
  workflow_dispatch:
    inputs:
      language:
        description: 'Dil'
        required: true
        default: 'de'
        type: choice
        options: [de, en, tr]
      privacy:
        description: 'YouTube gizlilik'
        required: true
        default: 'public'
        type: choice
        options: [public, unlisted, private]
      dry_run:
        description: 'Sadece üret, YouTube''a yükleme'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: makrokontext-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 145

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: FFmpeg ve fontlar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu-core
          # Kapak için dar ve kalın yazı tipi (DejaVu Sans Condensed Bold): aynı genişliğe daha büyük yazı
          sudo apt-get install -y -qq fonts-dejavu-extra || echo "::warning::fonts-dejavu-extra kurulamadı; kapakta standart yazı tipi kullanılacak."

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Belgeseli üret ve yükle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          WIKI_CONTACT: ${{ secrets.WIKI_CONTACT }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_PRIVACY: ${{ inputs.privacy || 'public' }}
          PYTHONUNBUFFERED: '1'
        run: |
          ARGS="--lang ${{ inputs.language || 'de' }} --privacy ${{ inputs.privacy || 'public' }}"
          # Zamanlanmış çalıştırmada aynı gün ikinci video üretilmez; elle tetiklemede her zaman üretir.
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --skip-if-done"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # Geçici servis kesintilerine (Gemini 503 vb.) karşı: başarısız olursa 10 dk bekleyip bir kez daha dene.
          # İkinci denemede --skip-if-done: video o gün zaten yüklendiyse tekrar yüklenmez.
          set +e
          python main.py $ARGS
          code=$?
          if [ $code -ne 0 ] && [ $code -ne 2 ]; then
            echo "::warning::İlk deneme başarısız (çıkış kodu $code). 10 dakika sonra yeniden denenecek."
            sleep 600
            python main.py $ARGS --skip-if-done
            code=$?
          fi
          exit $code

      - name: Konu hafızasını kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(memory): konu hafızası güncellendi [skip ci]"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

      - name: Kayıtlar ve plan (7 gün)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kayitlar-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            output/logs/
            output/plan.json
            output/metadata.json
            output/render.json
            output/credits.json
            output/short.json
            output/subtitles.srt
            output/thumbnails/

      - name: Video (yalnızca dry-run'da, 3 gün)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          retention-days: 3
          path: |
            output/final_documentary.mp4
            output/short.mp4
